 c.onpointerdown=e=>{e.preventDefault();dr=true;x.beginPath();x.moveTo(...pt(e));c.setPointerCapture(e.pointerId)};
 c.onpointermove=e=>{if(!dr)return;x.lineTo(...pt(e));x.stroke();sigOK=true;$("f_sig").classList.remove("bad")};
 c.onpointerup=end;c.onpointercancel=end;
 $("clr").onclick=()=>{x.clearRect(0,0,c.width,c.height);sigOK=false;S.sigimg="";S.sigsm="";save()}}
// Copy sent to the server: 500px wide, black ink on white (readable even if signed in dark mode), a few KB
function sigSmall(c){const w=500,h=Math.round(c.height*w/c.width),o=document.createElement("canvas");o.width=w;o.height=h;
 const g=o.getContext("2d");g.drawImage(c,0,0,w,h);g.globalCompositeOperation="source-in";g.fillStyle="#000";g.fillRect(0,0,w,h);
 g.globalCompositeOperation="destination-over";g.fillStyle="#fff";g.fillRect(0,0,w,h);return o.toDataURL("image/png")}
// Rotating the phone resizes the canvas; redraw the saved signature at the new size
addEventListener("resize",()=>{const c=$("sig");if(c&&Math.abs(c.getBoundingClientRect().width-sigW)>1)initSig()});
function rows(){return STEPS.map(st=>({t:st.i+" "+st.t,r:st.f.filter(f=>f[2]!="term"&&vis(f)).map(f=>[f[1],[].concat(S[f[0]]||"—").join(", ")||"—"])}))
 .concat([{t:"✍️ Termo",r:[["Decisões imediatas em emergência",S.aut],["Responsável por despesas veterinárias","Sim"],["Data",S.data||today()],["Assinatura","Assinado digitalmente"]]}])}
function text(){return "🐾 *FICHA DO PET*\n\n"+rows().map(s=>"*"+s.t+"*\n"+s.r.map(r=>"• "+r[0]+": "+r[1]).join("\n")).join("\n\n")}
function copy(t){if(navigator.clipboard&&isSecureContext)return navigator.clipboard.writeText(t);
 return new Promise((ok,no)=>{const a=document.createElement("textarea");a.value=t;a.setAttribute("readonly","");a.style.cssText="position:fixed;top:0;opacity:0";
  document.body.appendChild(a);a.select();a.setSelectionRange(0,t.length);const r=document.execCommand("copy");a.remove();r?ok():no()})}
function review(){$("lbl").textContent="Revisão final";
 $("card").innerHTML=`<h2>✅ Tudo certo?</h2><p class="sub">Confira as informações e envie para a veterinária.</p><div class="sum">${rows().map(s=>`<h3>${s.t}</h3>${s.r.map(r=>`<div><span>${esc(r[0])}</span><b>${esc(r[1]||"—")}</b></div>`).join("")}`).join("")}</div>
 <div class="nav end"><button class="w" id="wa">Enviar ficha</button><button class="o" id="cp">Copiar respostas</button><button class="g" id="bk">← Editar</button></div>
 <div class="saved" id="st" role="status" aria-live="polite">Ao enviar, a ficha é salva com segurança e o WhatsApp abre para avisar a veterinária.</div>`;
 $("bk").onclick=()=>{cur=LAST;save();render();toTop()};
 $("wa").onclick=enviar;
 $("cp").onclick=()=>copy(text()).then(()=>$("cp").textContent="Copiado ✓",()=>$("cp").textContent="Não deu para copiar, use o WhatsApp")}
// Only visible fields, plus the term; the server re-validates everything
function payload(){const p={};
 STEPS.forEach(st=>st.f.forEach(f=>{const v=S[f[0]];if(f[2]!="term"&&vis(f)&&v!=null&&v!=="")p[f[0]]=v}));
 return Object.assign(p,{aut:S.aut,desp:!!S.desp,data:S.data||today(),sig:S.sigsm||S.sigimg,site:S.site||"",_ms:Date.now()-S._t0})}
const LABEL=Object.fromEntries(STEPS.flatMap(s=>s.f).map(f=>[f[0],f[1]]).concat([["aut","Autorização"],["desp","Responsável pelas despesas"],["sig","Assinatura"],["data","Data"]]));
function goWA(){location.href="https://wa.me/"+WA+"?text="+encodeURIComponent(text())}
async function enviar(){const b=$("wa"),st=$("st");b.disabled=true;b.textContent="Enviando…";
 let why="ok",campo="";
 try{const r=await fetch(SB_URL+"/rest/v1/rpc/enviar_ficha",{method:"POST",
   headers:{"apikey":SB_KEY,"Content-Type":"application/json"},body:JSON.stringify({payload:payload()})});
  if(!r.ok){const j=await r.json().catch(()=>({}));[why,campo]=String(j.message||"erro:").split(":");if(r.status>=500)why="servidor"}}
 catch(e){why="rede"}
 if(why=="ok"){try{localStorage.removeItem(KEY)}catch(e){} // don't leave personal data on the phone
  st.textContent="Ficha salva ✓ Abrindo o WhatsApp…";setTimeout(goWA,600);return}
 if(["obrigatorio","tamanho","formato","invalido","intervalo"].includes(why)&&campo!="payload"){
  b.disabled=false;b.textContent="Enviar ficha";
  st.innerHTML=`Confira o campo <b>${esc(LABEL[campo]||campo)}</b> (toque em “Editar”) e envie de novo. <a href="#" id="wa2">Enviar só pelo WhatsApp</a>`;
  $("wa2").onclick=e=>{e.preventDefault();goWA()};return}
 // network/limit/server problem: the vet still receives the form via WhatsApp
 st.textContent=why=="limite"?"Muitos envios em pouco tempo. Abrindo o WhatsApp…":"Não conseguimos salvar online agora. Abrindo o WhatsApp…";
 setTimeout(goWA,1500)}
render();
</script></body></html>
